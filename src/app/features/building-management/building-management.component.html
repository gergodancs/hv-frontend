<div class="management-container p-5">

  <div class="surface-card p-4 shadow-2 border-round-xl">
    <p-table
      #dt
      [value]="buildings()"
      [rows]="10"
      [paginator]="true"
      [globalFilterFields]="['name', 'city', 'address', 'contactPerson']"
      responsiveLayout="scroll"
      styleClass="p-datatable-gridlines p-datatable-striped"
      [rowHover]="true">

      <ng-template pTemplate="caption">
        <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center gap-3">
          <span class="p-input-icon-left w-full md:w-20rem">

            <input
              pInputText
              type="text"
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
              placeholder="Globális keresés..."
              class="w-full"/>
          </span>

          <div class="flex flex-wrap gap-2">
            <p-select
              [options]="buildingTypes"
              [(ngModel)]="selectedTypeFilter"
              (onChange)="dt.filter($event.value, 'buildingType', 'equals')"
              placeholder="Típus szűrés"
              [showClear]="true"
              styleClass="w-full md:w-12rem">
            </p-select>

            <p-selectButton
              [options]="activeOptions"
              [(ngModel)]="selectedActiveFilter"
              (onChange)="dt.filter($event.value, 'active', 'equals')"
              optionLabel="label"
              optionValue="value">
            </p-selectButton>
          </div>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name" class="bg-gray-50">Név
            <p-sortIcon field="name"></p-sortIcon>
          </th>
          <th class="bg-gray-50">Irányítószám</th>
          <th class="bg-gray-50">Cím</th>
          <th class="bg-gray-50">Kontakt</th>
          <th class="bg-gray-50">Típus</th>
          <th class="bg-gray-50">Státusz</th>
          <th class="bg-gray-50" style="width: 8rem">Műveletek</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-building>
        <tr>
          <td class="font-medium">{{ building.name }}</td>
          <td><span class="p-tag p-tag-info p-tag-rounded">{{ building.postCode }}</span></td>
          <td>{{ building.city }}, {{ building.address }}</td>
          <td>
            <div class="flex flex-column">
              <span>{{ building.contactPerson }}</span>
              <small class="text-500">{{ building.contactPhone }}</small>
            </div>
          </td>
          <td>{{ building.buildingType }}</td>
          <td>
            <p-tag [severity]="building.active ? 'success' : 'danger'"
                   [value]="building.active ? 'Aktív' : 'Inaktív'"></p-tag>
          </td>
          <td>
            <div class="flex gap-2">
              <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="success"
                        (onClick)="editBuilding(building)"></p-button>
              <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                        (onClick)="deleteBuilding(building)"></p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center p-5 text-600">Nincs megjeleníthető épület.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
  <p-button
    icon="pi pi-plus"
    [rounded]="false"
    severity="primary"
    class="floating-add-btn shadow-4"
    (onClick)="openNew()"
    pTooltip="Új épület hozzáadása">
  </p-button>
</div>


<app-building-form-dialog [(visible)]="isDialogVisible"
                          [building]="selectedBuilding"
                          (onSaved)="loadBuildings()"></app-building-form-dialog>
<p-confirmDialog></p-confirmDialog>
